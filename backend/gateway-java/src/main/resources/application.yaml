eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8763/eureka/
spring:
  application:
    name: gateway-java

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/api/v1/**
              filters:
                - AuthenticationFilter
jwt :
  secret: ${JWT_SECRET}
  expiration: 900000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: gateway

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web: TRACE